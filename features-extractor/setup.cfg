# Based on https://wemake-python-styleguide.readthedocs.io/en/latest/pages/usage/configuration.html#
[flake8]
show-source = false
statistics = false
min-name-length = 3
max-name-length = 30
max-returns = 3
max-local-variables = 10
max-arguments = 10
max-module-members = 10
max-methods = 10
max-line-complexity = 15
max-line-length = 120
max-jones-score = 15
max-imports = 15
max-imported-names = 50
max-base-classes = 3
max-decorators = 5
max-try-body-length = 3
max-attributes = 10
max-cognitive-score = 15
max-complexity = 7

# Excluding some directories:
exclude =
  src/models
  README.md
  .git
  __pycache__
  .venv
  venv
  .eggs
  *.egg
  dist
  data
  .vscode
  .mypy_cache
  src/model/blocks/attention.py

# Exclude some pydoctest checks globally:
ignore=Q000,WPS305,S403,S101,S301,WPS458,WPS110,WPS226,E203,WPS338,WPS400,WPS306,WPS440,WPS350,WPS114,WPS100

per-file-ignores =
  src/utils/schemas.py:WPS115
  src/cli/create_annotation_file.py:WPS202,WPS402
  src/cli/extract_features.py:WPS402
  src/cli/upload_to_s3.py:RST203
  src/cli/trim_video_file.py:WPS201,WPS402,RST203
  src/cli/update_fps.py:RST203
  src/datasets/streamer.py:WPS436,WPS212
  src/inference/tools.py:WPS221,WPS204
  src/inference/__init__.py:WPS412,WPS410,WPS300
  src/inference/preparation/video_preparation.py:N806,WPS111,WPS602,WPS221

[isort]
include_trailing_comma = true
use_parentheses = true
multi_line_output = 3
