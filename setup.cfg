# Based on https://wemake-python-styleguide.readthedocs.io/en/latest/pages/usage/configuration.html#
[flake8]
show-source = false
statistics = false
min-name-length = 3
max-name-length = 35
max-returns = 3
max-local-variables = 20
max-arguments = 10
max-module-members = 10
max-methods = 10
max-line-complexity = 15
max-line-length = 120
max-jones-score = 15
max-imports = 15
max-imported-names = 50
max-base-classes = 3
max-decorators = 5
max-try-body-length = 3
max-attributes = 10
max-cognitive-score = 15
max-complexity = 7

# Excluding some directories:
exclude =
  src/metrics/moments/recall_at_one.py  # second side code
  src/metrics/moments/avg_precision.py  # second side code
  src/metrics/moments/utils.py  # second side code
  src/model/blocks/deformable_detr/**/*.py  # second side code
  src/losses/saliency_losses.py  # second side code
  src/model/blocks/attention.py
  src/analysis/multiple.py
  README.md
  .git
  __pycache__
  .venv
  venv
  .eggs
  *.egg
  dist
  data
  .vscode
  .mypy_cache


# Exclude some pydoctest checks globally:
ignore=Q000,WPS305,S403,S101,S301,WPS458,WPS110,WPS226,E203,WPS338,WPS400,WPS306,WPS440,WPS350,WPS121,WPS201,WPS100,WPS402,WPS529,WPS339

per-file-ignores =
  src/utils/span_utils.py:WPS204
  src/utils/rw_utils.py:C901,WPS210,WPS231,WPS220
  src/model/blocks/encoder.py:WPS210,WPS440
  src/model/blocks/transformer.py:WPS210
  src/model/model.py:WPS210,WPS211,C901,WPS230,WPS204,WPS221,WPS232,WPS220
  src/model/blocks/detector.py:WPS350,WPS210,WPS337,W503
  src/cli/train.py:WPS437,WPS237,WPS421,WPS213
  src/model/utils/model_utils.py:WPS465
  src/cli/utils/instantiators.py:WPS437
  src/dataset/collate.py:WPS204,WPS232
  src/losses/matcher.py:WPS210
  src/model/blocks/layers.py:WPS210,WPS204,WPS230
  src/dataset/utils.py:WPS100
  src/losses/utils.py:WPS100
  src/metrics/matching/metrics.py:WPS232
  src/analysis/map.py:WPS518,WPS504,WPS504,WPS358,WPS114,WPS432,WPS111,B008,WPS404
  src/callbacks/nms_callback.py:E800
  src/utils/optuna.py:WPS232

[isort]
profile = black
include_trailing_comma = true
use_parentheses = true
multi_line_output = 3
