defaults:
  - default
  - _self_

accelerator: gpu
devices: 1
min_steps: 17500  # prevents early stopping
max_steps: 17500  # steps to train for
max_epochs: 30  # epochs to train for
check_val_every_n_epoch: 1  # perform a validation loop every N training epochs
log_every_n_steps: 5  # log every N steps
