_target_: src.datamodule.MomentRetrievalDataModule
num_workers: 20
batch_size: 4

# annotation paths
annotation_path_train: /data/dataset/moment_retrieval/youtube/youtube_train_updated_not_all.jsonl
annotation_path_val: /data/dataset/moment_retrieval/youtube/youtube_valid_updated_not_all.jsonl
annotation_path_test: /data/dataset/moment_retrieval/youtube/youtube_valid_updated_not_all.jsonl

# caption paths
query_feat_dir_train: /data/dataset/moment_retrieval/youtube/custom_features/custom_text/
query_feat_dir_val: /data/dataset/moment_retrieval/youtube/custom_features/custom_text/
query_feat_dir_test: /data/dataset/moment_retrieval/youtube/custom_features/custom_text/

# video paths
video_feat_dir_train: /data/dataset/moment_retrieval/youtube/youtube_custom_features/video/
video_feat_dir_val: /data/dataset/moment_retrieval/youtube/youtube_custom_features/video/
video_feat_dir_test: /data/dataset/moment_retrieval/youtube/youtube_custom_features/video/

# audio_paths
audio_feat_dir_train: /data/dataset/moment_retrieval/youtube/youtube_custom_features/audio/
audio_feat_dir_val: /data/dataset/moment_retrieval/youtube/youtube_custom_features/audio/
audio_feat_dir_test: /data/dataset/moment_retrieval/youtube/youtube_custom_features/audio/

dataset:
  _target_: src.dataset.youtube.YouTube
  _partial_: true
  domain: "dog"
  max_query_length: 40
  max_video_length: 1000 #75
  data_ratio: 1
  normalize_video: true
  normalize_query: true
  use_tef: true
  clip_len: 2
  max_windows: 10
